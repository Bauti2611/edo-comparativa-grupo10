  <!--
    Runs before the first paint: applies the saved theme and mode (or the session-only URL overrides
    ?theme=dark|light|auto and ?mode=projection|normal, which are never persisted) so there is no flash.
    All storage access is guarded. Keep the storage key in sync with js/ui/prefs.js.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      var theme = 'auto';
      var mode = 'normal';
      try {
        var stored = JSON.parse(window.localStorage.getItem('edo.g10.prefs.v1') || 'null');
        if (stored) {
          if (stored.theme === 'light' || stored.theme === 'dark' || stored.theme === 'auto') theme = stored.theme;
          if (stored.mode === 'projection' || stored.mode === 'normal') mode = stored.mode;
        }
      } catch (e) { /* storage blocked or corrupted: defaults apply */ }
      try {
        var pairs = window.location.search.replace(/^\?/, '').split('&');
        for (var i = 0; i < pairs.length; i++) {
          var pair = pairs[i].split('=');
          var value = decodeURIComponent(pair[1] || '');
          if (pair[0] === 'theme' && (value === 'light' || value === 'dark' || value === 'auto')) theme = value;
          if (pair[0] === 'mode' && (value === 'projection' || value === 'normal')) mode = value;
        }
      } catch (e) { /* malformed query: ignore the overrides */ }
      var dark = false;
      try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { /* no matchMedia */ }
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-mode', mode);
      root.setAttribute('data-scheme', theme === 'dark' || (theme === 'auto' && dark) ? 'dark' : 'light');
    })();
  </script>
